      <stop stop-color="#FFFFF4"/>
      <stop offset=".23" stop-color="#FFF8DF"/>
      <stop offset=".43" stop-color="#FFE3C1" stop-opacity=".96"/>
      <stop offset=".68" stop-color="#F1C5B5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E0B5C6" stop-opacity="0"/>
