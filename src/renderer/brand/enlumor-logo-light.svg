<svg xmlns="http://www.w3.org/2000/svg" width="434" height="270" viewBox="0 0 434 270" fill="none" role="img" aria-labelledby="enlumor-logo-title enlumor-logo-desc">
  <title id="enlumor-logo-title">Enlumor</title>
  <desc id="enlumor-logo-desc">Two connected, gently asymmetric opening pages, illuminated from their central seam in blue and warm ivory.</desc>
