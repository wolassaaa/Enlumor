name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Some vitest suites call .venv/Scripts/python.exe directly, so the venv must sit in the repo.
      - name: Python venv with PyMuPDF
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:python
